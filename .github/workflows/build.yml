name: Build vivo_fastboot

on:
  workflow_dispatch:
  push:

env:
  GIT_TERMINAL_PROMPT: "0"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout vivo_fastboot sources
        uses: actions/checkout@v4
        with:
          path: vivo_src

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Fetch AOSP 4.4 sources (layout the makefile expects)
        run: |
          mkdir -p aosp/system aosp/external

          # clone DEST URL@REF [URL@REF ...]  -> uses the first source that works
          clone() {
            dest="$1"; shift
            for src in "$@"; do
              url="${src%@*}"; ref="${src##*@}"
              echo ">>> trying $url @ $ref"
              if git clone --depth 1 --branch "$ref" "$url" "$dest"; then
                echo ">>> OK: $dest from $url @ $ref"
                return 0
              fi
              rm -rf "$dest"
            done
            echo "!!! FAILED to fetch $dest from any source"
            return 1
          }

          A=https://github.com/aosp-mirror
          L=https://github.com/LineageOS

          clone aosp/system/core \
            $A/platform_system_core@android-4.4.4_r1 \
            $L/android_system_core@cm-11.0

          clone aosp/system/extras \
            $A/platform_system_extras@android-4.4.4_r1 \
            $L/android_system_extras@cm-11.0

          clone aosp/external/zlib \
            $A/platform_external_zlib@android-4.4.4_r1 \
            $L/android_external_zlib@cm-11.0

          clone aosp/external/libselinux \
            $A/platform_external_libselinux@android-4.4.4_r1 \
            $L/android_external_libselinux@cm-11.0

          clone aosp/external/openssl \
            $A/platform_external_openssl@android-4.4.4_r1 \
            $L/android_external_openssl@cm-11.0

          # modern glibc already declares gettid(); rename libselinux's private copy
          sed -i 's/\bgettid\b/selinux_gettid/g' aosp/external/libselinux/src/procattr.c

          # replace stock fastboot with the vivo-modified one
          rm -rf aosp/system/core/fastboot
          mkdir aosp/system/core/fastboot
          cp -r vivo_src/. aosp/system/core/fastboot/
          rm -rf aosp/system/core/fastboot/.git

      - name: Compile
        working-directory: aosp/system/core/fastboot
        run: |
          # TOOLCHAIN= makes the makefile use the runner's gcc instead of /opt/poky.
          # Old 2014 C code needs relaxed flags on modern gcc.
          make -k TOOLCHAIN= \
               CFLAGS="-O2 -g -w -std=gnu89 -fcommon" \
               LIBS="-lpthread"
          file fastboot
          ./fastboot --help 2>&1 | head -20 || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: vivo-fastboot-linux-x86_64
          path: aosp/system/core/fastboot/fastboot
